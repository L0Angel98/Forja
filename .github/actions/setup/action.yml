name: Setup pnpm + Node
description: Instala pnpm, Node 22 y las dependencias del monorepo (con caché)

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
