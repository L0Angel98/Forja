name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, web, ingest]
    steps:
      - uses: actions/checkout@v4

      - id: owner
        run: echo "lowercase=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lowercase }}/forja-${{ matrix.app }}:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.lowercase }}/forja-${{ matrix.app }}:latest
